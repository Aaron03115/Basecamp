<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Basecamp{% endblock %} | Basecamp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Basecamp</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
              aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link{% if request.path == '/' %} active{% endif %}" href="/">Home</a>
          </li>
          {% for page in pages %}
          <li class="nav-item">
            <a class="nav-link{% if request.path == page.path %} active{% endif %}" href="{{ page.path }}">{{ page.label }}</a>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-light border-top py-3 mt-auto">
    <div class="container text-muted small">
      Basecamp: trip planning and summit log for backcountry hikers and climbers.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
