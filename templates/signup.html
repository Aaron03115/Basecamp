{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <h1 class="h2 mb-3">Create your account</h1>
  <form method="post" action="/signup" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="name">Name</label>
      <input class="form-control" id="name" name="name" value="{{ form.name }}" maxlength="80" required autofocus></div>
    <div class="mb-3"><label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" name="email" type="email" value="{{ form.email }}" maxlength="200" required></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" name="password" type="password" minlength="8" required>
      <div class="form-text">At least 8 characters.</div></div>
    <div class="mb-3"><label class="form-label" for="confirm">Confirm password</label>
      <input class="form-control" id="confirm" name="confirm" type="password" required></div>
    <button class="btn btn-primary" type="submit">Sign up</button>
    <span class="ms-2 small">Already have an account? <a href="/login">Log in</a></span>
  </form>
</div></div>
{% endblock %}
